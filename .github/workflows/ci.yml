name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies (phase 1 only)
        run: pip install pandas requests

      - name: Syntax check
        run: python -m py_compile phase*.py

      - name: Phase 1 smoke test (MITRE STIX fetch)
        run: python phase1_data_pipeline.py

      - name: Secret pattern guard
        run: |
          if rg -i --glob '!*.md' --glob '!.github/**' \
            '(api[_-]?key|password|secret|token|bearer)\s*[:=]\s*["'"'"'][^"'"'"']{8,}' .; then
            echo "::error::Possible hardcoded secret detected"
            exit 1
          fi
          echo "No obvious hardcoded secrets in tracked source"
